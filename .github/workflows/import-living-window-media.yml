name: Import Living Window video assets

on:
  push:
    paths:
      - ".github/workflows/import-living-window-media.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install video verification tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Download the four supplied videos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/media/living-window
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 300 \
            'https://at.adobe.com/XOfjhTTYC4VyM54D' \
            -o public/media/living-window/living-window-v5.mp4
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 300 \
            'https://at.adobe.com/jgRb8ufGiMM8TJB4' \
            -o public/media/living-window/living-window-smooth.mp4
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 300 \
            'https://at.adobe.com/RvUTgDWKFhGB9141' \
            -o public/media/living-window/living-window-alternate.mp4
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 300 \
            'https://at.adobe.com/rwAA3QowMnFPDfSB' \
            -o public/media/living-window/living-window-promo.mp4
          for file in public/media/living-window/*.mp4; do
            test "$(stat -c%s "$file")" -gt 1000000
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name \
              -of default=noprint_wrappers=1 "$file"
          done
      - name: Capture authentic still-frame thumbnails
        shell: bash
        run: |
          set -euo pipefail
          for name in living-window-v5 living-window-smooth living-window-alternate living-window-promo; do
            ffmpeg -hide_banner -loglevel error -y \
              -ss 4 -i "public/media/living-window/${name}.mp4" \
              -frames:v 1 -q:v 3 "public/media/living-window/${name}.jpg"
            test -s "public/media/living-window/${name}.jpg"
          done
      - name: Persist media in portfolio source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/media/living-window/
          git commit -m "Add four Living Window videos and real video-frame thumbnails"
          git push
